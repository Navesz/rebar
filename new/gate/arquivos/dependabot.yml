# Two ecosystems, and each one has a separate reason.
#
# `github-actions`: what ages in CI are the pinned action versions, and an
# outdated action is the one that disappears without warning when the runner
# changes.
#
# `npm`: this project is NOT zero-dependency — it is a Next with React, Tailwind
# and shadcn, and CI's `npm ci` installs all of it. The zero-dependency promise
# belongs to rebar-check, which runs through `npx github:Navesz/rebar` without
# installing anything.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Grouped so it does not open seven PRs a week. A dependency PR nobody reads
    # is noise that teaches people to close dependency PRs without reading.
    #
    # `dependencias` is the group NAME, not prose — it is the key Dependabot uses
    # to label the grouped PR. Renaming it is an identifier change, not a
    # translation.
    groups:
      dependencias:
        patterns: ['*']
