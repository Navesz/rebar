# O portão deste projeto. Dois passos, e os dois rodam igual na sua máquina:
#   npm run verificar
#   npx --yes github:Navesz/rebar .
#
# A MATRIZ EXISTE POR UM MOTIVO MEDIDO. O defeito de portabilidade que matou o
# projeto anterior — um `execFileSync("npx")` que não existe como executável no
# Windows — sobreviveu um ano porque o CI dele só rodava Linux. Aqui o mesmo
# comando precisa passar nos dois sistemas ou não passa em nenhum.

name: verificar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: verificar (${{ matrix.so }})
    runs-on: ${{ matrix.so }}
    # Teto de tempo, porque o padrão do GitHub é SEIS HORAS.
    #
    # O número que motivou a linha, medido em 31/08 gerando este projeto: o
    # `npm run verificar` inteiro leva 26 s com o cache quente, mas o `eslint`
    # sozinho levou 93 s na PRIMEIRA execução, com o cache de módulos frio — e
    # antes disso, três tentativas foram mortas em 200 s e em 280 s sem imprimir
    # uma linha. Lint frio nesta pilha é indistinguível de lint travado enquanto
    # se olha para ele. Um runner de CI está sempre frio.
    #
    # Sem o teto, uma regressão nesse caminho não vira erro: vira runner ocupado
    # por seis horas e um PR "em execução" a manhã inteira. Com o teto, é um X
    # vermelho em 20 minutos — quarenta vezes o pior tempo já medido, com folga
    # para a instalação e para o build.
    timeout-minutes: 20
    strategy:
      # Sem fail-fast: saber que quebrou só no Windows, ou nos dois, é metade do
      # diagnóstico. Cancelar a outra plataforma esconde exatamente isso.
      fail-fast: false
      matrix:
        so: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          # O rebar-check tem duas regras que leem `git log` — coautoria-ia e
          # identidade-git. Com o clone raso padrão (fetch-depth: 1) elas
          # enxergariam um commit só e aprovariam qualquer histórico.
          # Verificação que só vê o último commit não é verificação.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` e não `npm install`: o lockfile é a fonte, e o CI não decide
      # versão.
      - run: npm ci

      # Um comando só. O corpo dele está no package.json, para que o que roda
      # aqui seja literalmente o que se roda na máquina antes de abrir o PR.
      - name: verificar
        run: npm run verificar

      # A régua do rebar, por cima do que este repositório verifica de si mesmo.
      # Exit 0 é a única aprovação: 1 reprovou, 2 alvo inválido, 3 recorte
      # parcial, 127 o ferramental quebrou — todos derrubam o job.
      - name: régua do rebar
        run: npx --yes github:Navesz/rebar .

      # A RÉGUA DE SEGURANÇA, e ela é um binário DIFERENTE do mesmo pacote —
      # por isso o `-p`. Sem ele o npx roda o bin padrão, que é o checker de
      # formato, e este passo repetiria o de cima sem ninguém notar.
      #
      # Aqui pode ser rede: roda uma vez por push, não uma vez por commit. O
      # que não podia esperar pelo CI está no hook, escrito em shell.
      - name: régua de segurança
        run: npx --yes -p github:Navesz/rebar rebar-security .

  # ─────────────────────────────────────────────────────────────── publicação
  #
  # `needs: verificar` é a linha inteira do desenho: o deploy NÃO é um caminho
  # paralelo ao portão, é o que vem depois dele. Um workflow de publicação
  # separado subiria a página com o lint quebrado, e o portão viraria o que
  # este projeto existe para não ser — relatório que ninguém lê.
  #
  # A matriz roda nos dois sistemas; `needs` espera as DUAS pernas. Vermelho no
  # Windows não publica.
  #
  # SE ESTE PROJETO NÃO VAI PARA O GITHUB PAGES, apague este job inteiro. Ele
  # nasce aqui porque o preset `site` já vem com `output: "export"` e com o
  # `.pages.yml`: sem o job, o projeto tem tudo para publicar e nada que
  # publique, que foi o estado em que ele nasceu até 2026-09-06.
  #
  # Do lado do GitHub ainda falta um passo humano, e ele não é arquivo:
  # Settings › Pages › Source = "GitHub Actions". Sem isso o job roda e o
  # `deploy-pages` falha dizendo que a origem é outra.
  publicar:
    name: publicar no GitHub Pages
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Só este job recebe a permissão de escrever no Pages. O `contents: read`
    # do topo continua valendo para os outros.
    permissions:
      contents: read
      pages: write
      id-token: write

    # Um deploy por vez, e o mais novo espera em vez de cancelar o que já está
    # subindo: `cancel-in-progress` aqui deixaria a página no meio do caminho.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      # O mesmo `next build` que a régua já rodou. O `out/` não é versionado —
      # artefato de build no repositório é uma das coisas que o rebar acusa.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - id: publicacao
        uses: actions/deploy-pages@v4
