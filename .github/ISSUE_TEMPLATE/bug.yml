name: Bug
description: rebar crashed, exited with an unexpected code, or the gate misbehaved
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command and the full output. Exit code 127 means a rule broke, which is always a rebar defect.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, and how you ran it.
    validations:
      required: true
