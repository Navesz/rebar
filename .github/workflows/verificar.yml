# The rebar gate. One command only, the same one that runs on the machine:
#   node tooling/verify/verify.mjs
#
# THE MATRIX EXISTS FOR A MEASURED REASON. The alicerce config checks syntax with
# `find ferramental -name "*.mjs" -print0 | xargs -0 -n1 node --check`, which does
# not run on Windows. The defect survived because its CI only runs Linux. Here the
# same command has to pass on both systems or it passes on neither.
#
# There is one `npm ci`, and it has a single line of justification: prettier. The
# zero-dependency promise is the CHECKER's, not the repository's — `index.mjs`
# imports only built-ins, and `npx github:Navesz/rebar` runs without installing
# anything. If one day a SECOND dependency shows up here with no ADR, the premise
# broke.
#
# The workflow, job and step names stay in Portuguese: they are identifiers, not
# prose. The README badge addresses this file by name, and renaming the job
# renames the check that gates a merge.

name: verificar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: verificar (${{ matrix.so }})
    runs-on: ${{ matrix.so }}
    strategy:
      # No fail-fast: knowing that it broke only on Windows, or on both, is half
      # the diagnosis. Cancelling the other platform hides exactly that.
      fail-fast: false
      matrix:
        so: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          # The `auto` step runs rebar-check, and two of its rules — coautoria-ia
          # and identidade-git — read `git log`. With the default shallow clone
          # (fetch-depth: 1) they would see a single commit and would pass any
          # history. Verification that only sees the last commit is not
          # verification.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `npm ci` and not `npm install`: the lockfile is the source, and the CI
      # does not decide the version. The only package installed is prettier.
      - run: npm ci

      # `mcp/` is a separate package, with a dependency of its own (the MCP SDK).
      # Without this install the `mcp-servidor` step would be skipped in the CI,
      # and the only end-to-end test of the server would run nowhere — which is
      # exactly the state this module came out of.
      - run: npm ci
        working-directory: mcp

      - name: verificar
        # One command. Exit 0 is the only pass: 1 failed, 2 wrong config,
        # 3 partial slice, 127 the tooling broke — all of them bring the job down.
        run: node tooling/verify/verify.mjs
